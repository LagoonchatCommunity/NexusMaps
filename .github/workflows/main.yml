
name: Build NEXUS MAPS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/LagoonchatCommunity/NexusMaps/main/index.html" \
            --output app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-maps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
